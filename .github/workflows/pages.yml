name: Déploiement Plateforme Jeux

on:
    push:
        branches:
            - "**"
    pull_request:
        branches: [main]
    workflow_dispatch:

jobs:
    deploy-pages:
        name: Build & Déploiement GitHub Pages
        runs-on: ubuntu-latest
        if: github.event_name != 'pull_request'
        permissions:
            contents: write

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "lts/*"

            - name: Build Space Invaders
              working-directory: ./Space_Invaders
              run: |
                  npm ci
                  npm run build

            - name: Préparer le site
              run: |
                  rm -rf site
                  mkdir -p site/keep-white-space site/space-invaders
                  cp index.html style.css script.js site/
                  cp Keep_White_Space/index.html Keep_White_Space/main.js Keep_White_Space/logic.js site/keep-white-space/
                  cp -R Space_Invaders/build/* site/space-invaders/

            - name: Déploiement GitHub Pages
              uses: JamesIves/github-pages-deploy-action@v4
              with:
                  folder: site
                  branch: gh-pages
                  commit-message: "deploy(platform): ${{ github.sha }}"
                  token: ${{ secrets.GITHUB_TOKEN }}
