name: Tests Monorepo (Unitaires & Fonctionnels)

on:
  push:
    branches:
      - "*"
      - "*/*"
  pull_request:
    branches: [main]

jobs:
  # ==========================================
  # JOB 1 : TESTER LE PREMIER JEU (NPM / JS)
  # ==========================================
  test-keep-white-space:
    name: Tests Keep White Space
    runs-on: ubuntu-latest
    # On indique à GitHub de lancer toutes les commandes dans ce dossier :
    defaults:
      run:
        # on lui dit d'aller dans ce dossier pour faire les tests
        working-directory: ./Keep_White_Space

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Installation des dépendances (npm)
        run: npm ci

      - name: Tests Unitaires
        # on lance le script de test unitaire défini dans le package.json du jeu
        run: npm run test:unit

      - name: Installer les navigateurs Playwright
        run: npx playwright install --with-deps

      - name: Tests Fonctionnels
        run: npx playwright test
