name: Tests Monorepo (Unitaires & Fonctionnels)

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main]

jobs:
  # ==========================================
  # JOB 2 : SPACE INVADER (TS)
  # ==========================================
  test-space-invader:
    name: Tests Space Invader
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Space_Invader # ⚠️ À adapter selon le vrai nom de votre dossier
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Installation des dépendances
        run: npm ci

      - name: Audit de sécurité (DevSecOps)
        run: npm audit

      - name: Tests Unitaires (Faits main)
        run: |
          npx tsc tests.ts
          node tests.js
