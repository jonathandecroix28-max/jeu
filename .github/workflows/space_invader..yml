name: Tests Monorepo (Unitaires & Fonctionnels)

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  setup-space-invader:
    name: Setup Space Invader
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Space_Invaders
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: "./Space_Invaders/package-lock.json"
      - name: Installation des dépendances
        run: npm ci

  lint-space-invader:
    name: Lint Space Invader
    needs: setup-space-invader
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Space_Invaders
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Linting du code
        run: |
          npx eslint src/ts || echo "::warning::Des erreurs de style ont été détectées"
          echo "### Rapport de Linting 🎨" >> $GITHUB_STEP_SUMMARY
          echo "L'analyse du code est terminée." >> $GITHUB_STEP_SUMMARY

  audit-space-invader:
    name: Audit Space Invader
    needs: setup-space-invader
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: ./Space_Invaders
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Audit de sécurité
        run: |
          npm audit --audit-level=high || echo "::warning::Des vulnérabilités critiques existent dans Parcel"
          echo "### Rapport d'Audit 🛡️" >> $GITHUB_STEP_SUMMARY
          echo "Audit terminé. Vérifiez les logs pour les détails." >> $GITHUB_STEP_SUMMARY

  test-space-invader:
    name: Tests Space Invader
    needs: [lint-space-invader, audit-space-invader]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Space_Invaders
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Installation
        run: npm ci
      - name: Lancer les tests
        run: |
          if npm run tests; then
            echo "::notice::Tests unitaires réussis"
            echo "### Résultats des Tests ✅" >> $GITHUB_STEP_SUMMARY
            echo "Les tests unitaires ont été exécutés avec succès." >> $GITHUB_STEP_SUMMARY
          else
            echo "::error::Les tests unitaires ont échoué"
            echo "### Résultats des Tests ❌" >> $GITHUB_STEP_SUMMARY
            echo "Les tests unitaires ont échoué. Vérifiez les logs." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
  test-fonctionnel-space-invader:
    name: Tests Fonctionnels Space Invader
    needs: [lint-space-invader, audit-space-invader]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Space_Invaders
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Installation
        run: npm ci
      - name: Lancer les tests fonctionnels
        run: |
          echo "### Tests Fonctionnels 🧪" >> $GITHUB_STEP_SUMMARY
          echo "Les tests fonctionnels sont en cours d'exécution..." >> $GITHUB_STEP_SUMMARY
          if npm run | grep -qE "^\s+test:functional"; then
            if npm run test:functional; then
              echo "::notice::Tests fonctionnels réussis"
              echo "Tests fonctionnels terminés avec succès." >> $GITHUB_STEP_SUMMARY
            else
              echo "::error::Les tests fonctionnels ont échoué"
              echo "Tests fonctionnels en échec. Vérifiez les logs." >> $GITHUB_STEP_SUMMARY
              exit 1
            fi
          else
            echo "::warning::Aucun script npm 'test:functional' trouvé dans package.json"
            echo "Aucun script 'test:functional' configuré (job non bloquant)." >> $GITHUB_STEP_SUMMARY
          fi
  resume-tests-space-invader:
    name: Résumé des Tests Space Invader
    if: always()
    needs:
      [
        test-space-invader,
        test-fonctionnel-space-invader,
        audit-space-invader,
        lint-space-invader,
        setup-space-invader,
        build-space-invader,
      ]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Space_Invaders
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Résumé des tests
        run: |
          echo "### Résumé Final des Tests 🏁" >> $GITHUB_STEP_SUMMARY
          echo "- Audit : ${{ needs.audit-space-invader.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Lint : ${{ needs.lint-space-invader.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tests Unitaires : ${{ needs.test-space-invader.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tests Fonctionnels : ${{ needs.test-fonctionnel-space-invader.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build : ${{ needs.build-space-invader.result }}" >> $GITHUB_STEP_SUMMARY
          echo "Vérifiez les étapes précédentes pour les détails des résultats." >> $GITHUB_STEP_SUMMARY

  build-space-invader:
    name: Build Space Invader
    needs:
      [
        test-space-invader,
        test-fonctionnel-space-invader,
        audit-space-invader,
        lint-space-invader,
        setup-space-invader,
      ]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Space_Invaders
    steps:
      - uses: actions/checkout@v4
      - name: Installation et Build
        run: |
          npm ci
          npm run build
      - name: Résumé du Build
        run: echo "### Build Terminé 🚀" >> $GITHUB_STEP_SUMMARY

  deploy-space-invader:
    name: Déploiement GitHub Pages
    needs: build-space-invader
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installation et Build
        run: |
          cd Space_Invaders
          npm ci
          npm run build
      - name: Déploiement 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: Space_Invaders/build
          branch: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}
